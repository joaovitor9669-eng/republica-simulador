<style>

color:var(--muted)}.sidebar button.active{color:#14212d;background:var(--gold)}.sidebar button:hover:not(.active){color:var(--ink);background:#1e3043}.main{padding:25px;max-width:1260px;width:100%;margin:auto}.panel{padding:21px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#172438,#111c2b);margin:0 0 16px}.hero{padding:24px;border:1px solid #6e5f43;border-radius:14px;background:radial-gradient(ellipse at right,#2e3640,#142032 65%);margin-bottom:18px}.flex{display:flex;align-items:center;gap:11px;flex-wrap:wrap}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{padding:15px;border:1px solid var(--line);border-radius:11px;background:#101b2b}.stat strong{font-size:27px;display:block;line-height:1.3;font-variant-numeric:tabular-nums}.stat small{font-size:11px;letter-spacing:.5px}.pill{display:inline-block;border:1px solid #645b46;color:var(--gold);font-size:10px;font-weight:800;padding:3px 8px;border-radius:18px;letter-spacing:.6px}.pill.green{border-color:#3e776c;color:var(--teal)}.pill.red{border-color:#90494a;color:var(--red)}.rowline{padding:12px 0;border-bottom:1px solid #304054}.rowline:last-child{border-bottom:0}.action{border:1px solid var(--line);border-radius:11px;padding:15px;display:flex;gap:14px;justify-content:space-between;align-items:center;margin-top:10px}.action p{margin:3px 0 0;color:var(--muted);font-size:12px}.badge{font-size:11px;font-weight:750;color:var(--teal)}.notice{background:#24303c;border:1px solid #635a47;border-radius:10px;padding:13px;color:#ead9b8;font-size:12px;margin:12px 0}.log{display:grid;gap:9px}.event{border-left:3px solid #567c94;padding:9px 12px;background:#132235;border-radius:0 8px 8px 0}.event.sim{border-left-color:var(--gold)}.event time{font-size:10px;color:var(--gold);font-weight:750}.event p{margin:2px 0 0;font-size:12px}.empty{padding:28px;border:1px dashed #405875;text-align:center;color:var(--muted);border-radius:10px}.formGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.formField label{font-weight:700;display:block;margin:0 0 5px;font-size:12px}.formField .muted{font-size:11px}.partyGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.party{border:1px solid var(--line);border-radius:10px;padding:13px;background:#142235;text-align:left}.party b{display:block;font-size:16px}.party small{font-size:11px}.party.active{border-color:var(--gold)}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:var(--gold);background:#1b2b40}.table th,.table td{padding:10px;border-bottom:1px solid var(--line)}.table-wrap{overflow:auto}.footer{font-size:11px;color:var(--muted);padding:20px 0 40px}.tiny{font-size:11px}.nav-mobile{display:none}.headerline{margin-bottom:17px}.line{height:7px;border-radius:20px;background:#283b50;overflow:hidden;margin:9px 0}.line>div{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold))}.micro{font-size:11px;color:var(--muted)}.kickoff{font-size:10px;font-weight:800;color:var(--gold);letter-spacing:1.5px}.toast{position:fixed;bottom:24px;right:20px;z-index:50;padding:14px 18px;background:#2d4d48;border:1px solid var(--teal);border-radius:12px;box-shadow:0 12px 30px #0009;max-width:380px}.hidden{display:none!important}#importfile{display:none}.logo-circle{display:grid;place-items:center;width:48px;height:48px;border:2px solid var(--gold);color:var(--gold);border-radius:50%;font-size:23px;font-weight:800}
@media(max-width:1000px){.partyGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:780px){.shell{display:block}.sidebar{display:none}.nav-mobile{display:flex;position:sticky;top:0;z-index:20;overflow:auto;gap:5px;padding:9px;background:#0c1624;border-bottom:1px solid var(--line)}.nav-mobile button{flex-shrink:0;font-size:11px;padding:8px 11px}.nav-mobile button.active{background:var(--gold);color:#142030}.topbar{padding:9px 12px;min-height:64px;height:auto;flex-wrap:wrap;gap:6px}.topbar .brand{font-size:15px}.topbar button{padding:6px 7px;font-size:10px}.topbar .pill{font-size:9px}.topbar>.flex:last-child{gap:5px}.main{padding:14px}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.panel{padding:15px}.hero{padding:18px}h1{font-size:25px}}@media(max-width:480px){.grid3,.formGrid,.partyGrid{grid-template-columns:1fr}.stat strong{font-size:23px}.action{display:block}.action button{margin-top:10px;width:100%}}
</style></head><body><header class="topbar"><div class="flex"><div class="logo-circle" style="width:39px;height:39px;font-size:17px">R</div><div class="brand">REPÚBLICA <i>·</i><small>SIMULADOR DE PODER</small></div></div><div class="flex"><span class="pill" id="datepill">OUT / 2026</span><button class="ghost" data-action="export">Exportar</button><button class="ghost" data-action="import">Importar</button><button class="ghost" data-action="new">Novo jogo</button></div></header><nav class="nav-mobile" id="mobile"></nav><div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="main" id="root"><div class="empty">Preparando a República...</div></main></div><input type="file" id="importfile" accept="application/json,.json"><div id="toast" class="toast hidden"></div>
<script>
(function(){'use strict';
const SKEY='republica-simulador-v01';const START='2026-10-31';const VOTE='2028-10-01';const CYCLE=604800000;
const PARTY_DATA=`MDB|15|Baleia Rossi;PDT|12|Carlos Lupi;PT|13|Edinho Silva;PCdoB|65|Nádia Campeão (em exercício);PSB|40|João Campos;PSDB|45|Aécio Neves;AGIR|36|Daniel Tourinho;MOBILIZA|33|Antonio Carlos Bosco Massarollo;CIDADANIA|23|Alex Manente;PV|43|José Luiz Penna;AVANTE|70|Luis Henrique Resende;PP|11|Ciro Nogueira;PSTU|16|José Maria de Almeida;PCB|21|Edmilson Silva Costa;PRTB|28|Leonardo Alves de Araújo;DC|27|João Caldas (em exercício);PCO|29|Rui Costa Pimenta;PODE|20|Renata Abreu;REPUBLICANOS|10|Marcos Pereira;PSOL|50|Paula Coradi;PL|22|Valdemar Costa Neto;PSD|55|Gilberto Kassab;SOLIDARIEDADE|77|Paulo Pereira da Silva;NOVO|30|Eduardo Ribeiro;REDE|18|Paulo Lamac;DEMOCRATA|35|Suêd Haidar;UP|80|Leonardo Péricles;UNIÃO|44|Antônio Rueda;PRD|25|Marcus Ferreira;MISSÃO|14|Renan Santos`;
const PARTIES=PARTY_DATA.split(';').map(x=>{let [id,number,chair]=x.split('|');return {id,number:Number(number),chair};});
const CITIES=[['Recife','PE'],['Paulista','PE'],['São Lourenço da Mata','PE'],['Arcoverde','PE'],['Caruaru','PE'],['Olinda','PE'],['Jaboatão dos Guararapes','PE'],['Petrolina','PE'],['Garanhuns','PE'],['Vitória de Santo Antão','PE'],['Casa Nova','BA'],['Salvador','BA'],['São Paulo','SP'],['Rio de Janeiro','RJ'],['Brasília','DF'],['Belo Horizonte','MG'],['Fortaleza','CE'],['Porto Alegre','RS'],['Curitiba','PR'],['João Pessoa','PB'],['Maceió','AL'],['Campinas','SP'],['Niterói','RJ'],['Juazeiro','BA'],['Santos','SP']].map(([name,uf])=>({name,uf}));
const NAV=[['painel','Visão geral'],['acoes','Agenda e ações'],['partido','Partidos'],['bases','Bases locais'],['rede','Rede política'],['imprensa','Imprensa'],['eleicoes','Eleições'],['legislativo','Legislativo'],['diario','Diário'],['fontes','Fontes e limites']];
const ACTIVITIES=[
{id:'bases',title:'Visitar bases locais',desc:'Ouvir demandas, identificar interlocutores e fortalecer presença territorial.',delta:{base:4,reputation:1,energy:-3},requires:null},
{id:'rede',title:'Reunião com liderança comunitária',desc:'Conversa institucional com personagem fictício e construção de confiança.',delta:{network:4,base:1,energy:-3},requires:null},
{id:'partido',title:'Participar de reunião partidária',desc:'Atuar no diretório local, disputar espaço e compreender decisões.',delta:{party:5,network:1,energy:-2},requires:'party'},
{id:'comunicacao',title:'Preparar entrevista e posicionamento',desc:'Apresentar propostas ao público fictício da simulação.',delta:{media:4,reputation:2,energy:-3},requires:null},
{id:'estudo',title:'Estudar Direito Eleitoral e orçamento',desc:'Aprimorar domínio de regras, calendário e limites institucionais.',delta:{expertise:4,energy:-2},requires:null},
{id:'organizacao',title:'Organizar voluntários',desc:'Construir capacidade de mobilização com atuação lícita.',delta:{structure:4,network:1,energy:-4},requires:'party'},
{id:'alianca',title:'Negociação interna documentada',desc:'Propor cooperação partidária sem prometer recursos irregulares.',delta:{party:3,network:3,energy:-4},requires:'party'},
{id:'prestacao',title:'Organizar recursos e prestação de contas',desc:'Planejar atividades financeiras com transparência e limites.',delta:{resources:4,expertise:1,energy:-3},requires:'party'}
];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=x=>Math.round(Math.max(0,Math.min(100,x)));
function rng(g){let s=(g.seed>>>0)||982451653;s^=s<<13;s^=s>>>17;s^=s<<5;g.seed=s>>>0;return (g.seed>>>0)/4294967296;}
function addWeeks(iso,n){const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+7*n);return d.toISOString().slice(0,10);}
function formatDate(s){return new Date(s+'T12:00:00Z').toLocaleDateString('pt-BR',{month:'short',year:'numeric',day:'2-digit',timeZone:'UTC'});}
function logged(g,msg,source='sim'){g.logs.unshift({date:g.date,msg,source});g.logs=g.logs.slice(0,150);}
function createGame(form){let g={version:1,date:START,seed:(Math.floor(Math.random()*0xffffffff)>>>0)||1,player:{name:form.name,age:Number(form.age),origin:form.origin,city:form.city,uf:form.uf,party:form.party||'',joined:form.party?START:null,role:'Cidadão',nominated:false,requested:false,won:null},stats:{base:8,network:8,party:form.party?12:0,media:6,reputation:8,expertise:form.origin==='Direito'?22:9,structure:4,resources:8,energy:95},ap:2,week:0,candidates:[],events:[],npc:[{id:1,name:'Lívia Nogueira',role:'Liderança comunitária',relation:16},{id:2,name:'Marcos Vidal',role:'Dirigente municipal',relation:12},{id:3,name:'Ana Bezerra',role:'Jornalista local',relation:7},{id:4,name:'Renato Prado',role:'Articulador político',relation:8}],factions:[{name:'Articulação programática',power:55},{name:'Organização territorial',power:45}],zones:[{name:'Núcleo urbano A',reach:8},{name:'Núcleo urbano B',reach:5},{name:'Núcleo periférico',reach:6},{name:'Núcleo rural',reach:3}],logs:[],press:null,results:null,legislation:[],turn:0};
logged(g,'Início da carreira em '+g.player.city+'/'+g.player.uf+'. Cidade real; bases, personagens e acontecimentos políticos posteriores são fictícios.');
if(g.player.party)logged(g,'Filiação simulada ao '+g.player.party+' registrada na linha do tempo alternativa.');return g;}
function canRun(g){return g.player.age + (2028-2026)>=18 && Boolean(g.player.party) && Boolean(g.player.joined) && g.player.joined<='2028-04-01';}
function change(g,delta){Object.entries(delta).forEach(([k,v])=>g.stats[k]=cap(g.stats[k]+v));}
function action(g,id){const a=ACTIVITIES.find(x=>x.id===id);if(!a)throw Error('Ação inválida');if(g.ap<=0)throw Error('Sem horários livres nesta semana.');if(a.requires==='party'&&!g.player.party)throw Error('Esta atividade exige filiação simulada.');if(g.stats.energy<8)throw Error('Energia insuficiente. Avance a semana para descansar.');if(g.results&&g.player.role==='Vereador'&&id==='partido'){}change(g,a.delta);g.ap--;g.turn++;const n=g.npc[Math.floor(rng(g)*g.npc.length)];if(id==='rede'||id==='alianca'||id==='partido'){n.relation=cap(n.relation+2+Math.floor(rng(g)*5));}if(id==='bases'){const z=g.zones[Math.floor(rng(g)*g.zones.length)];z.reach=cap(z.reach+2);}logged(g,a.title+' — '+a.desc);return g;}
function press(g,opt){if(g.ap<=0)throw Error('Sem horários livres nesta semana.');const opts=[{id:'dialogo',txt:'Defender diálogo institucional e transparência',delta:{reputation:3,media:2,network:1}},{id:'propostas',txt:'Apresentar propostas com ressalvas e fontes',delta:{expertise:2,media:3,base:1}},{id:'prudencia',txt:'Evitar compromisso antes de estudar os dados',delta:{expertise:2,media:1,party:1}}];let choice=opts.find(x=>x.id===opt);if(!choice)throw Error('Resposta desconhecida');change(g,choice.delta);g.ap--;g.press=null;logged(g,'Entrevista simulada: '+choice.txt+'. Veículo e jornalista fictícios.');return g;}
function nextWeek(g,num){for(let j=0;j<num;j++){const before=g.date;g.date=addWeeks(g.date,1);g.week++;g.ap=2;g.stats.energy=cap(g.stats.energy+13);if(g.week%3===0){let i=Math.floor(rng(g)*g.npc.length),n=g.npc[i],delta=rng(g)>.50?2:-1;n.relation=cap(n.relation+delta);logged(g,'Movimento autônomo: '+n.name+' ('+n.role+') '+(delta>0?'ampliou contatos institucionais.':'priorizou outra agenda.')+' [Personagem fictício]');}
if(g.week%8===0)logged(g,'O diretório local, representado por NPCs fictícios, realizou reunião e atualizou sua agenda.');
if(g.date>='2028-07-01'&&g.date<='2028-08-31'&&!g.player.requested&&g.week%2===0)logged(g,'Período de convenções no calendário simulado. Consulte Eleições para solicitar a indicação.');
if(before<VOTE&&g.date>=VOTE&&!g.results)resolveElection(g);
if(g.results&&g.player.won&&g.date>='2029-01-01'&&g.player.role!=='Vereador'){g.player.role='Vereador';logged(g,'Posse simulada na Câmara Municipal. Atuação legislativa liberada.');}
if(g.week%6===0)g.press={question:'Como você concilia suas propostas, os limites de orçamento e as expectativas dos grupos locais?',by:'Ana Bezerra — jornalista fictícia'};
}return g;}
function requestNomination(g){if(g.player.requested)throw Error('A decisão da convenção já foi registrada.');if(g.date<'2028-07-01'||g.date>'2028-09-01')throw Error('A janela de convenção simulada é julho/agosto de 2028.');if(!canRun(g))throw Error('Elegibilidade básica não atendida: verifique idade, filiação e prazo.');const score=g.stats.party*.40+g.stats.network*.25+g.stats.structure*.15+g.stats.base*.2;const threshold=18+rng(g)*24;g.player.requested=true;g.player.nominated=score>=threshold;logged(g,g.player.nominated?'Convenção fictícia aprovou sua indicação para a disputa de vereador.':'Convenção fictícia não aprovou sua indicação. Você pode continuar sua carreira e negociar outras funções.');return g;}
function allocateSeats(votes,seats){const a=votes.map((v,i)=>({v,i,seat:0}));for(let n=0;n<seats;n++){a.sort((x,y)=>y.v/(y.seat+1)-x.v/(x.seat+1));a[0].seat++;}return a.sort((x,y)=>x.i-y.i).map(x=>x.seat);}
function resolveElection(g){const slate=[g.player.party||'SEM PARTIDO','MDB','PT','PL','PSD','UNIÃO'].filter((x,i,a)=>a.indexOf(x)===i&&x!=='SEM PARTIDO');const ballots=slate.map((_,i)=>Math.round(8000+Math.floor(rng(g)*14000)+(i===0&&g.player.nominated?g.stats.party*50:0)));const seats=allocateSeats(ballots,11);let playerVotes=0,rank=0,won=false;if(g.player.nominated){playerVotes=Math.round(100+(g.stats.base*.7+g.stats.structure*.5+g.stats.media*.25+g.stats.network*.35)*17+rng(g)*500);const rivals=[...Array(5)].map(()=>Math.round(280+rng(g)*2000));rank=1+rivals.filter(v=>v>playerVotes).length;won=rank<=seats[0]&&seats[0]>0;}g.player.won=won;g.player.role=won?'Vereador eleito (aguarda posse)':g.player.nominated?'Ex-candidato a vereador':'Articulador local';g.results={slate,ballots,seats,playerVotes,rank,won,date:VOTE,councilSeats:11};logged(g,'Apuração da eleição inteiramente FICTÍCIA de 2028. '+(g.player.nominated?(won?'Mandato alcançado.':'Candidatura não eleita; sua carreira continuará.'):'Sem candidatura do jogador neste ciclo.'));}
function proposal(g){if(g.player.role!=='Vereador')throw Error('Ato depende de exercício de mandato legislativo no jogo.');if(g.ap<1)throw Error('Agenda da semana esgotada.');const topics=['Requerimento de informações à Prefeitura','Projeto de transparência administrativa','Audiência pública sobre serviços locais'];const item={title:topics[g.legislation.length%topics.length],date:g.date,status:'Protocolado (simulação)',week:g.week};g.legislation.unshift(item);g.ap--;logged(g,'Ação legislativa simulada: '+item.title+'. Protocolo não implica aprovação.');}
function serial(g){if(!g||g.version!==1||!g.player||!g.stats||!g.date||!Array.isArray(g.logs))throw Error('Formato de carreira inválido.');return JSON.stringify(g);}
let game=null,tab='painel',selectedParty='',cityList=[...CITIES];const root=document.getElementById('root'),mobile=document.getElementById('mobile'),side=document.getElementById('sidebar'),fileInput=document.getElementById('importfile');
function toast(x){const t=document.getElementById('toast');t.textContent=x;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3500);}
function persist(){try{localStorage.setItem(SKEY,serial(game));}catch(e){toast('Salvamento automático indisponível. Exporte a carreira.');}}
function load(){try{const s=localStorage.getItem(SKEY);if(s){const g=JSON.parse(s);serial(g);game=g;}}catch(e){try{localStorage.removeItem(SKEY);}catch(_){}}}
function stat(label,val){return `<div class="stat"><small>${label}</small><strong>${val}</strong><div class="line"><div style="width:${cap(val)}%"></div></div></div>`;}
function title(heading,sub){return `<div class="headerline"><span class="eyebrow">REPÚBLICA • ${esc(game.player.city)} / ${esc(game.player.uf)}</span><h1>${heading}</h1>${sub?`<p class="muted">${sub}</p>`:''}</div>`;}
function nav(){if(!game){side.innerHTML='';mobile.innerHTML='';return;}const b=NAV.map(([id,label])=>`<button class="${id===tab?'active':''}" data-tab="${id}">${label}</button>`).join('');side.innerHTML=`<div class="eyebrow" style="padding:12px">MENU DA CARREIRA</div>`+b+`<div class="notice" style="margin:16px 4px">Universo alternativo. Personagens locais e acontecimentos posteriores a 2026 são fictícios.</div>`;mobile.innerHTML=b;}
function start(){return `<section class="hero"><span class="eyebrow">BRASIL • 31 OUTUBRO 2026</span><h1 style="margin:8px 0">A política começa muito antes da eleição.</h1><p style="max-width:700px;color:var(--muted)">Crie um personagem desconhecido, escolha um município real e construa uma carreira política. Partidos e dirigentes nacionais têm identificação pública; interlocutores locais e acontecimentos são ficção do jogo.</p></section><section class="panel"><h2>Criar sua carreira</h2><p class="muted">A primeira versão jogável cobre ascensão local e eleições municipais simuladas de 2028.</p><form id="newgame"><div class="formGrid"><div class="formField"><label>Nome do personagem</label><input name="name" maxlength="50" required placeholder="Seu personagem fictício"></div><div class="formField"><label>Idade em outubro de 2026</label><input name="age" type="number" min="16" max="90" value="27" required></div><div class="formField"><label>Origem profissional</label><select name="origin"><option>Direito</option><option>Educação</option><option>Comércio</option><option>Saúde</option><option>Organização comunitária</option><option>Outra</option></select></div><div class="formField"><label>Município de início</label><input id="citysearch" placeholder="Digite município ou UF" autocomplete="off"><select name="city" id="cityselect" required></select><div class="micro" id="ibgenote">Lista inicial; tentativa de atualizar municípios via IBGE.</div></div><div class="formField" style="grid-column:1 / -1"><label>Filiação inicial (opcional)</label><select name="party"><option value="">Sem partido — decidir durante a carreira</option>${PARTIES.map(p=>`<option value="${p.id}">${p.id} · ${p.number}</option>`).join('')}</select><div class="micro">A filiação é simulada. Não altera nenhum registro eleitoral real.</div></div></div><div class="notice">Dados do TSE: siglas e diretórios nacionais. Município: nome e UF verificados. Nenhum resultado eleitoral futuro é previsto por este jogo.</div><button class="primary" type="submit">Iniciar carreira política</button></form></section>`;}
function dashboard(){let g=game;return `${title('Gabinete de estratégia', 'Sua trajetória é definida por relações, tempo, escolhas e instituições.')}
<section class="hero"><div class="flex between"><div><span class="eyebrow">${esc(g.player.role)}</span><h1 style="margin:5px 0">${esc(g.player.name)}</h1><p class="muted">${esc(g.player.city)} · ${esc(g.player.party||'Sem filiação')} · ${formatDate(g.date)}</p></div><div><span class="pill">SIMULAÇÃO POLÍTICA</span></div></div></section>
<div class="grid4">${stat('Presença nas bases',g.stats.base)}${stat('Rede institucional',g.stats.network)}${stat('Influência partidária',g.stats.party)}${stat('Exposição pública',g.stats.media)}</div>
<div class="grid2" style="margin-top:16px"><section class="panel"><h2>Agenda desta semana</h2><p class="muted">${g.ap} horários disponíveis · Energia ${g.stats.energy}/100</p><div class="flex"><button class="primary" data-tab="acoes">Definir ações</button><button data-action="advance" data-n="1">Avançar 1 semana</button><button data-action="advance" data-n="4">+ 4 semanas</button></div><div class="notice">Próxima eleição municipal da simulação: outubro de 2028. As regras de 2028 poderão mudar.</div></section><section class="panel"><h2>Últimos acontecimentos</h2><div class="log">${g.logs.slice(0,4).map(e=>`<div class="event sim"><time>${formatDate(e.date)} · ${e.source==='sim'?'SIMULAÇÃO':'HISTÓRICO'}</time><p>${esc(e.msg)}</p></div>`).join('')}</div></section></div>`;}
function actions(){return `${title('Agenda e ações','Cada escolha consome um dos seus dois horários semanais; outras lideranças continuam agindo.')}
<div class="grid3">${stat('Organização',game.stats.structure)}${stat('Reputação local',game.stats.reputation)}${stat('Conhecimento',game.stats.expertise)}</div>
<section class="panel" style="margin-top:16px"><div class="flex between"><h2>Seu tempo é limitado</h2><span class="pill">${game.ap} AÇÕES DISPONÍVEIS</span></div>${ACTIVITIES.map(a=>`<div class="action"><div><strong>${a.title}</strong><p>${a.desc}</p></div><button data-do="${a.id}" ${game.ap<1||game.stats.energy<8||(a.requires==='party'&&!game.player.party)?'disabled':''}>Executar</button></div>`).join('')}</section><div class="panel"><h2>Avançar o calendário</h2><p class="muted">Ao avançar, eventos independentes acontecem e a energia se recupera. Ações não gastas não são acumuladas.</p><div class="flex"><button class="primary" data-action="advance" data-n="1">+1 semana</button><button data-action="advance" data-n="4">+4 semanas</button><button data-action="advance" data-n="12">+12 semanas</button></div></div>`;}
function parties(){return `${title('Diretórios partidários','A identificação de cada legenda é histórica; as disputas locais desta carreira são ficcionais.')}
<section class="panel"><div class="flex between"><div><h2>Filiação e convenção</h2><p class="muted">Situação do personagem: ${esc(game.player.party||'sem partido')}</p></div><span class="pill">${game.player.joined?'Filiado desde '+formatDate(game.player.joined):'NÃO FILIADO'}</span></div><div class="notice">Em uma eleição real, filiação, domicílio, prazos estatutários e demais requisitos devem ser aferidos pelas normas vigentes. Aqui, trata-se de filiação fictícia.</div>${game.player.party?'':`<button class="primary" data-action="join" ${!selectedParty?'disabled':''}>Solicitar filiação fictícia a ${esc(selectedParty||'um partido')}</button>`}</section>
<section class="panel"><h2>30 partidos registrados no TSE</h2><p class="muted tiny">Dirigente nacional: referência histórica do cadastro consultado em outubro de 2026; não representa atuação no universo fictício.</p><div class="partyGrid">${PARTIES.map(p=>`<button class="party ${selectedParty===p.id?'active':''}" data-pickparty="${p.id}"><b>${esc(p.id)} · ${p.number}</b><small>Direção nacional: ${esc(p.chair)}</small></button>`).join('')}</div></section>`;}
function bases(){return `${title('Bases locais','Núcleos territoriais inteiramente fictícios, sem correspondência obrigatória com bairros reais.')}
<section class="panel"><h2>Presença territorial</h2><p class="muted">A força local se desenvolve ao longo de semanas, com organização, diálogo e atuação pública.</p>${game.zones.map(z=>`<div class="rowline"><div class="flex between"><strong>${z.name}</strong><span class="badge">${z.reach}/100</span></div><div class="line"><div style="width:${z.reach}%"></div></div></div>`).join('')}<div class="flex" style="margin-top:15px"><button class="primary" data-do="bases">Visitar bases</button><button data-do="organizacao" ${!game.player.party?'disabled':''}>Organizar voluntários</button></div></section>`;}
function network(){return `${title('Rede política','Interlocutores locais simulados: nenhuma destas pessoas corresponde a um político real identificado.')}
<div class="grid2">${game.npc.map(n=>`<div class="panel"><span class="pill">PERSONAGEM FICTÍCIO</span><h2 style="margin-top:10px">${esc(n.name)}</h2><p class="muted">${esc(n.role)}</p><div class="flex between"><span>Relação simulada</span><strong>${n.relation}/100</strong></div><div class="line"><div style="width:${n.relation}%"></div></div></div>`).join('')}</div><section class="panel"><h2>Atuação de terceiros</h2><p class="muted">Alguns personagens tomam decisões independentes durante o avanço semanal. Você verá os eventos relevantes no diário.</p><button data-do="rede" class="primary">Conversar com uma liderança</button></section>`;}
function media(){return `${title('Imprensa','As entrevistas e os veículos são integralmente fictícios.')}
<section class="panel"><span class="pill">ENTREVISTA SIMULADA</span><h2 style="margin:10px 0">Uma pergunta ao seu personagem</h2><p>${esc(game.press?.question||'Como pretende construir confiança pública sem prometer resultados fora da competência do cargo?')}</p><p class="muted tiny">${esc(game.press?.by||'Ana Bezerra — jornalista fictícia')}</p><div class="action"><div><strong>Diálogo e transparência</strong><p>Priorizar prestação de contas e interlocução institucional.</p></div><button data-press="dialogo" ${game.ap<=0?'disabled':''}>Responder</button></div><div class="action"><div><strong>Propostas fundamentadas</strong><p>Explicar opções e limitações de execução.</p></div><button data-press="propostas" ${game.ap<=0?'disabled':''}>Responder</button></div><div class="action"><div><strong>Prudência e estudo</strong><p>Comprometer-se a examinar dados e competências.</p></div><button data-press="prudencia" ${game.ap<=0?'disabled':''}>Responder</button></div></section>`;}
function election(){let g=game;const windowCon=g.date>='2028-07-01'&&g.date<='2028-08-31';return `${title('Eleições municipais','O voto de 2028 e todos os concorrentes são fictícios; esta não é uma previsão eleitoral.')}
<section class="panel"><div class="grid3">${stat('Apoio nas bases',g.stats.base)}${stat('Apoio interno',g.stats.party)}${stat('Organização',g.stats.structure)}</div><h2 style="margin-top:20px">Candidatura a vereador</h2><div class="rowline"><strong>Idade mínima na data do pleito</strong><span style="float:right">${g.player.age+2>=18?'Atendida':'Não atendida'}</span></div><div class="rowline"><strong>Filiação simulada com 6 meses</strong><span style="float:right">${g.player.joined&&g.player.joined<='2028-04-01'?'Atendida':'Pendente'}</span></div><div class="rowline"><strong>Indicação pela convenção</strong><span style="float:right">${g.player.requested?(g.player.nominated?'Aprovada':'Recusada'):'Não decidida'}</span></div><div class="notice">Regras eleitorais pedagógicas e incompletas. A data de 1º/10/2028 é usada como parâmetro de simulação (primeiro domingo de outubro), sujeita ao calendário oficial. Nacionalidade, domicílio eleitoral real, estatutos e inelegibilidades não são auditados.</div>${!g.player.requested?`<button class="primary" data-action="convention" ${!windowCon||!canRun(g)?'disabled':''}>Solicitar indicação na convenção</button>`:''}
${g.player.requested?`<p><span class="pill ${g.player.nominated?'green':'red'}">${g.player.nominated?'INDICAÇÃO APROVADA':'INDICAÇÃO RECUSADA'}</span></p>`:''}<p class="muted tiny">${windowCon?'Janela de convenção simulada aberta.':'Janela de convenção simulada: julho e agosto de 2028.'}</p></section>
${g.results?`<section class="panel"><span class="eyebrow">Resultado fictício • 2028</span><h2>Apuração municipal simulada</h2><p>${g.player.nominated?'Votos nominais fictícios do personagem: '+g.results.playerVotes+' · Posição na lista do partido: '+g.results.rank:'Personagem não concorreu neste ciclo.'}</p><span class="pill ${g.results.won?'green':'red'}">${g.player.nominated?(g.results.won?'ELEITO NA SIMULAÇÃO':'NÃO ELEITO NA SIMULAÇÃO'):'SEM CANDIDATURA'}</span><div class="table-wrap"><table class="table"><thead><tr><th>Legenda real</th><th>Votos fictícios</th><th>Cadeiras fictícias</th></tr></thead><tbody>${g.results.slate.map((p,i)=>`<tr><td>${esc(p)}</td><td>${g.results.ballots[i].toLocaleString('pt-BR')}</td><td>${g.results.seats[i]}</td></tr>`).join('')}</tbody></table></div><div class="notice">Distribuição por maiores médias simplificada, NÃO é aplicação integral do sistema proporcional (quociente, cláusulas individuais e sobras) previsto no Código Eleitoral brasileiro. Câmara-modelo fictícia com 11 cadeiras, independentemente da Câmara real do município.</div></section>`:''}`;}
function legislative(){return `${title('Legislativo','Uma simulação inicial de atuação municipal, sem reproduzir integralmente o regimento de cada Câmara.')}
${game.player.role!=='Vereador'?`<div class="empty">A atuação legislativa simplificada será habilitada se o personagem vencer a eleição fictícia e tomar posse em janeiro de 2029. A derrota não encerra a carreira.</div>`:`<section class="panel"><span class="pill green">MANDATO SIMULADO ATIVO</span><h2 style="margin:12px 0">Atos legislativos</h2><p class="muted">Protocolar não significa aprovar ou executar uma política pública.</p><button class="primary" data-action="proposal" ${game.ap<1?'disabled':''}>Protocolar novo requerimento / proposição</button>${game.legislation.map(x=>`<div class="rowline"><strong>${esc(x.title)}</strong><p class="muted tiny">${formatDate(x.date)} · ${x.status}</p></div>`).join('')}</section>`}`;}
function diary(){return `${title('Diário da República','Uma trilha de decisões, ações de outros personagens e acontecimentos da história alternativa.')}
<div class="panel"><div class="flex between"><h2>Cronologia da carreira</h2><button data-action="export">Exportar arquivo JSON</button></div><div class="log" style="margin-top:16px">${game.logs.map(x=>`<div class="event ${x.source==='sim'?'sim':''}"><time>${formatDate(x.date)} · ${x.source==='sim'?'SIMULAÇÃO':'HISTÓRICO'}</time><p>${esc(x.msg)}</p></div>`).join('')}</div></div>`;}
function sources(){return `${title('Fontes e limites','O que é histórico verificado e o que o jogo inventou para simular uma carreira.')}
<div class="panel"><h2>Histórico identificado</h2><p>Siglas, números e dirigentes nacionais consultados na página de registro partidário do TSE. Municípios e UFs: lista inicial de municípios reais e consulta à API de localidades do IBGE quando disponível.</p><p><a target="_blank" rel="noopener noreferrer" href="https://www.tse.jus.br/partidos/partidos-registrados-no-tse/registrados-no-tse">TSE: partidos registrados</a></p><p><a target="_blank" rel="noopener noreferrer" href="https://servicodados.ibge.gov.br/api/docs/localidades">IBGE: API de municípios</a></p><p><a target="_blank" rel="noopener noreferrer" href="https://www.tse.jus.br/legislacao/codigo-eleitoral/lei-das-eleicoes/lei-das-eleicoes-lei-nb0-9.504-de-30-de-setembro-de-1997">Lei das Eleições (art. 9º)</a></p><p><a target="_blank" rel="noopener noreferrer" href="https://www.tse.jus.br/legislacao/codigo-eleitoral/codigo-eleitoral-1/codigo-eleitoral-lei-nb0-4.737-de-15-de-julho-de-1965">Código Eleitoral (quocientes e sobras)</a></p></div>
<div class="panel"><h2>O que NÃO é informação real</h2><p>NPCs locais, os núcleos eleitorais, qualquer apoio, entrevista, evento futuro, números de recursos, porcentagens, votos e resultados da eleição simulada. O jogo não oferece previsões sobre eleições reais e não apresenta afirmações sobre motivações de dirigentes reais.</p><p>A lista inicial do TSE e dirigentes pode ficar desatualizada. Verifique datas e alterações diretamente na fonte. Não há orçamento público ou população municipal real nesta versão.</p></div>
<div class="panel"><h2>Próximas expansões, ainda NÃO jogáveis</h2><p>Prefeituras, deputados, Senado, governos estaduais, ministérios, Presidência, órgãos de controle, macroeconomia e relações internacionais. O objetivo é conectar todas essas carreiras à mesma simulação persistente.</p></div>`;}
function render(){document.getElementById('datepill').textContent=game?formatDate(game.date):'OUT / 2026';nav();if(!game){root.innerHTML=start();fillCities();return;}root.innerHTML=({painel:dashboard,acoes:actions,partido:parties,bases:bases,rede:network,imprensa:media,eleicoes:election,legislativo:legislative,diario:diary,fontes:sources})[tab]();}
function fillCities(){const sel=document.getElementById('cityselect'),term=document.getElementById('citysearch');if(!sel)return;const options=cityList.filter(c=>!term.value||((c.name+' '+c.uf).toLowerCase().includes(term.value.toLowerCase())));sel.innerHTML=options.slice(0,200).map(c=>`<option value="${esc(c.name)}|${esc(c.uf)}">${esc(c.name)} / ${esc(c.uf)}</option>`).join('')||'<option value="">Nenhuma correspondência</option>';}
async function ibge(){try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),5000);const r=await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/municipios?view=nivelado',{signal:controller.signal});clearTimeout(timer);if(!r.ok)throw Error('API indisponível');const data=await r.json();const parsed=data.map(x=>({name:x['municipio-nome']||x.nome,uf:x['UF-sigla']||x.microrregiao?.mesorregiao?.UF?.sigla||''})).filter(x=>x.name&&x.uf);if(parsed.length>5000){cityList=parsed.sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));const n=document.getElementById('ibgenote');if(n)n.textContent='Municípios carregados da API oficial do IBGE.';if(!game)fillCities();}}catch(e){const n=document.getElementById('ibgenote');if(n)n.textContent='Usando lista local de municípios reais. API IBGE indisponível no momento.';}}
root.addEventListener('input',e=>{if(e.target.id==='citysearch')fillCities();});
root.addEventListener('submit',e=>{if(e.target.id!=='newgame')return;e.preventDefault();const f=new FormData(e.target);const [city,uf]=String(f.get('city')||'').split('|');if(!city||!uf)return toast('Selecione um município.');const name=String(f.get('name')||'').trim(),age=Number(f.get('age'));if(!name||age<16||age>90)return toast('Revise nome e idade.');game=createGame({name,age,origin:f.get('origin'),city,uf,party:f.get('party')});tab='painel';persist();render();});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.tab){tab=b.dataset.tab;render();return;}if(b.dataset.pickparty){selectedParty=b.dataset.pickparty;render();return;}if(b.dataset.do){action(game,b.dataset.do);persist();render();return;}if(b.dataset.press){press(game,b.dataset.press);persist();render();return;}const a=b.dataset.action;if(!a)return;if(a==='new'){if(game&&!confirm('Começar outra carreira? Exporte o save antes, pois o progresso atual será substituído.'))return;game=null;tab='painel';selectedParty='';localStorage.removeItem(SKEY);render();ibge();}else if(a==='join'){if(!selectedParty)throw Error('Escolha uma legenda primeiro.');if(game.player.party)throw Error('Você já está filiado.');game.player.party=selectedParty;game.player.joined=game.date;game.stats.party=cap(game.stats.party+12);logged(game,'Filiação fictícia ao '+selectedParty+' registrada em '+formatDate(game.date)+'.');persist();render();}else if(a==='advance'){const n=Number(b.dataset.n||1);nextWeek(game,n);persist();render();}else if(a==='convention'){requestNomination(game);persist();render();}else if(a==='proposal'){proposal(game);persist();render();}else if(a==='export'){if(!game)return toast('Crie uma carreira antes de exportar.');const url=URL.createObjectURL(new Blob([serial(game)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='republica-carreira-'+game.date+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}else if(a==='import'){fileInput.click();}}catch(err){toast(err.message);}});
fileInput.addEventListener('change',async()=>{try{const f=fileInput.files?.[0];if(!f)return;if(f.size>2000000)throw Error('Save muito grande');const g=JSON.parse(await f.text());serial(g);game=g;tab='painel';persist();render();}catch(err){toast('Falha ao importar: '+err.message);}finally{fileInput.value='';}});
// Função exposta apenas para testes automatizados de desenvolvimento.
window.RepublicaTest={PARTIES,createGame,action,nextWeek,canRun,allocateSeats,requestNomination,resolveElection,serial};load();render();ibge();
})();
</script></body></html>
